{% extends "_base.html" %}
{% block body %}
{% if hero_image_url %}
<tr><td>
<img src="{{ hero_image_url }}" width="600" style="width:100%; max-width:600px; display:block;" alt="">
</td></tr>
{% endif %}

<tr><td style="padding:28px 32px 8px;">
<h1 style="margin:0; font-size:26px; line-height:1.3; color:#1a1a1a;">{{ headline }}</h1>
</td></tr>

{% if intro_paragraph %}
<tr><td style="padding:12px 32px 0;">
<p style="margin:0; font-size:15px; line-height:1.6; color:#444444;">{{ intro_paragraph }}</p>
</td></tr>
{% endif %}

<tr><td align="center" style="padding:20px 32px 8px;">
<a href="{{ cta_url }}" style="{{ button_css }}">{{ cta_text }}</a>
</td></tr>

{% for p in remaining_paragraphs %}
<tr><td style="padding:12px 32px 0;">
<p style="margin:0; font-size:15px; line-height:1.6; color:#444444;">{{ p }}</p>
</td></tr>
{% endfor %}

<tr><td align="center" style="padding:24px 32px 8px;">
<a href="{{ cta_url }}" style="{{ button_css }}">{{ cta_text }}</a>
</td></tr>
{% endblock %}
